name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes etl ml stats app tests
      - run: python -m pytest -q

  pipeline-smoke:
    # One real quarter end to end: download, parse, load, quality gate, signals.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m etl.run --quarters 2024q1 --from-year 2024 --to-year 2024
      - run: python -m etl.run --quarters 2024q1 --from-year 2024 --to-year 2024  # second run must skip
      - run: python -m stats.signals --species Dog
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality_report.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t animal-drug-safety .
      - run: |
          docker run -d --name api -p 8000:8000 animal-drug-safety
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
